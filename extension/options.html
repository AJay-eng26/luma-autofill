<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Luma Autofill settings</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #111; }
    h1 { font-size: 22px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    textarea { min-height: 110px; }
    .hint { color: #555; font-weight: 400; font-size: 13px; }
    button { margin-top: 20px; padding: 10px 18px; font: 600 15px system-ui; border: 0; border-radius: 8px; background: #6d28d9; color: #fff; cursor: pointer; }
    #status { margin-left: 12px; color: #15803d; font-weight: 600; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin-top: 24px; padding: 8px 16px 16px; }
  </style>
</head>
<body>
  <h1>✨ Luma Autofill</h1>
  <p>Your details are stored only in this browser. On a Luma event, click <b>Register</b>, then the purple <b>✨ Autofill</b> button. You always click submit yourself.</p>

  <label>Import profile.json <span class="hint">(optional: fills the boxes below from your existing file)</span>
    <input type="file" id="import" accept=".json,application/json">
  </label>

  <fieldset>
    <legend>Your details</legend>
    <label>Full name * <input id="name"></label>
    <label>Email * <input id="email" type="email"></label>
    <label>Phone <input id="phone"></label>
    <label>Company <input id="company"></label>
    <label>Role / job title <input id="role"></label>
    <label>LinkedIn <input id="linkedin"></label>
    <label>X handle <input id="x_handle" placeholder="@yourhandle"></label>
    <label>Website <input id="website"></label>
    <label>Location <span class="hint">(e.g. "Chennai, India" or "APAC")</span> <input id="location"></label>
    <label>About you <span class="hint">(2–3 sentences the AI uses for open questions)</span><textarea id="about"></textarea></label>
  </fieldset>

  <fieldset>
    <legend>AI drafting</legend>
    <label>Anthropic API key <span class="hint">(starts with sk-ant-; stored only in this browser)</span>
      <input id="apiKey" type="password" autocomplete="off">
    </label>
    <label>Model <input id="model" placeholder="claude-opus-5-5"></label>
  </fieldset>

  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
